[package]
name = "azul-box"
authors = ["Tahoso", "https://codeberg.org/Tahoso/azul-box"]
version = "0.4.0"
edition = "2024"
description = "A utility box for ffmpeg, yt-dlp, and more"
license = "GPL-3.0-only"
readme = "README.md"
homepage = "https://codeberg.org/Tahoso/azul-box"
repository = "https://codeberg.org/Tahoso/azul-box"


[dependencies]
base64 = "0.23.0"
dirs = "6.0.0"
eframe = "0.37.0"
ftail = "0.3.1"
image = {version ="0.25.10", default-features = false, features = ["rayon","png","webp","jpeg"]}
lofty = "0.25.4"
log = "0.4.34"
regex = "1.13.1"
rfd = "0.17.2"
rodio = {version ="0.22.2", default-features = false, features = ["vorbis","playback"] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = "1.0.154"
textdistance = "1.1.1"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
toml = "1.1.8"
ureq = { version = "3.4.2", features = ["json"] }
url = "2.5.8"
zip = {version = "9.0.5", default-features = false, features = ["bzip2","deflate"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
